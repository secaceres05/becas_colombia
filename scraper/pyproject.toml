[tool.poetry]
name = "becas-scraper"
version = "0.1.0"
description = "Microservicio de ingesta de becas colombianas (Scrapy + Playwright)"
authors = ["Sebastian"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
scrapy = "~2.12"
twisted = "<24.3.0"
playwright = "^1.44"
scrapy-playwright = "^0.0.43"
httpx = "^0.27"
python-dotenv = "^1.0"
pydantic = "^2.7"
apscheduler = "^3.10"
beautifulsoup4 = "^4.12"
pypdf = "^4.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
ruff = "^0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
